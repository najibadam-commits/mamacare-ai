<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- Security: no external scripts, styles, fonts, frames or beacons. connect-src 'self' means the app can only
         talk to its own origin (the /api proxy to the RAG engine). Relaxed automatically in `vite dev` only. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; media-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3C5D" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="description" content="MamaCare AI - maternal health guidance, appointments and care directory." />
    <title>MamaCare AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
