# MamaCare AI - production nginx (Alpine package build).
# Static PWA + same-origin reverse proxy of /api to the rag-engine container.
user nginx;
worker_processes auto;
error_log /dev/stderr warn;

# Dynamic modules installed by Alpine packages (nginx-mod-http-brotli drops its load_module line here).
include /etc/nginx/modules/*.conf;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types {
    application/manifest+json webmanifest;
  }

  server_tokens off;
  access_log /dev/stdout;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  client_max_body_size 16k;          # chat messages are tiny; nothing larger is ever legitimate
  client_body_timeout 10s;
  client_header_timeout 10s;
  send_timeout 15s;

  # --- Compression for low-bandwidth users -------------------------------------------------
  # Pre-compressed .gz / .br files are created at image build time (scripts/precompress.mjs).
  gzip on;
  gzip_static on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml application/xml;

  # Optional extras written by the image / entrypoint: brotli.conf (if the module installed), tls.conf (if certs mounted).
  include /etc/nginx/extra/*.conf;

  # --- Abuse protection for the chat endpoint ------------------------------------------------
  limit_req_zone $binary_remote_addr zone=chat:10m rate=60r/m;   # per client IP; clinics often share one NAT address
  limit_req_status 429;

  # Docker's embedded DNS. Resolved per request (not at start-up), so nginx boots even if the
  # backend is down and follows the backend across container re-creations.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/http-redirect.conf;   # empty unless FORCE_HTTPS=true and certificates are mounted
    include /etc/nginx/snippets/app.conf;
  }
}
