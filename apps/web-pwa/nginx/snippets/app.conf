# Locations shared by the HTTP (80) and HTTPS (443) servers.

# Liveness probe (no logging, no redirect).
location = /healthz {
  access_log off;
  default_type text/plain;
  return 200 "ok\n";
}

# Backend health, for operators and scripts/verify-pilot: GET /api/health -> rag-engine /health
location = /api/health {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  set $rag_health http://rag-engine:8000/health;
  proxy_pass $rag_health;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_connect_timeout 3s;
  proxy_read_timeout 5s;
}

# Chat API -> rag-engine (internal network only; port 8000 is never published).
location /api/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-store" always;
  limit_except GET POST { deny all; }
  limit_req zone=chat burst=20 nodelay;
  set $rag_upstream http://rag-engine:8000;
  proxy_pass $rag_upstream;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;     # the PWA gives up after 5 s and shows its offline fallback anyway
}

# Hashed build assets: cache for a year.
location /assets/ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# Files that must always be revalidated so updates reach users (service worker, shell, manifest).
location ~* ^/(index\.html|sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "no-cache" always;
  try_files $uri =404;
}

# Icons and everything else static; unknown paths fall back to the SPA shell.
location / {
  include /etc/nginx/snippets/security-headers.conf;
  add_header Cache-Control "public, max-age=86400" always;
  try_files $uri $uri/ /index.html;
}
