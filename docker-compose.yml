# MamaCare AI - production-style stack:  docker compose up -d --build
#
#   Internet -> web-pwa (nginx :80/:443) --/api--> rag-engine (:8000, internal network only)
#
# Copy .env.example to .env to change ports or enable TLS / an optional LLM.
name: mamacare

services:
  rag-engine:
    build:
      context: ./services/rag-engine
    image: mamacare/rag-engine:${MAMACARE_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      RAG_EMBEDDING_BACKEND: ${RAG_EMBEDDING_BACKEND:-hash}
      RAG_MIN_RELEVANCE: ${RAG_MIN_RELEVANCE:-0.12}
      RAG_AUTO_INGEST: "true"
      RAG_CHROMA_DIR: /srv/rag-engine/data/chroma
      # Optional OpenAI-compatible LLM. Leave empty for the default extractive (quote-only) answers.
      # NOTE: using an external LLM sends the user's question text to that provider and requires
      # outbound network access (see the `backend` network below). Review NDPA implications first.
      RAG_LLM_BASE_URL: ${RAG_LLM_BASE_URL:-}
      RAG_LLM_MODEL: ${RAG_LLM_MODEL:-}
      RAG_LLM_API_KEY: ${RAG_LLM_API_KEY:-}
    expose:
      - "8000"            # reachable only from other containers on the `backend` network
    volumes:
      - chroma-data:/srv/rag-engine/data/chroma
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  web-pwa:
    build:
      context: .                              # monorepo root: pnpm needs the workspace files
      dockerfile: apps/web-pwa/Dockerfile
    image: mamacare/web-pwa:${MAMACARE_VERSION:-0.1.0}
    restart: unless-stopped
    depends_on:
      rag-engine:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
      - "${WEB_TLS_PORT:-443}:443"
    environment:
      FORCE_HTTPS: ${FORCE_HTTPS:-false}      # redirect HTTP->HTTPS (requires certificates below)
    volumes:
      # Optional TLS: put fullchain.pem and privkey.pem in ./deploy/certs to enable HTTPS on 443.
      - ./deploy/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - backend

networks:
  frontend: {}
  # `internal: true` = the RAG engine has NO route to the internet (privacy by default).
  # If you enable an external LLM, set `internal: false` (or give rag-engine its own egress network).
  backend:
    internal: true

volumes:
  chroma-data: {}
